<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calcular - Soccer Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:#070810;
  --deep:#0d0f1a;
  --card:#131625;
  --border:#1e2235;
  --green:#00e676;
  --green-dim:#00b85a;
  --green-glow:rgba(0,230,118,0.18);
  --white:#f0f4ff;
  --muted:#7a82a0;
  --accent:#ff6b35;
  --nav1-h:52px;
  --nav2-h:58px;
  --top-offset:110px;
}

html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:2px}

/* NAVBAR 1 */
#nav1{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--nav1-h);background:var(--black);
  border-bottom:1px solid var(--green);
  display:flex;align-items:center;justify-content:center;
}

#nav1 .brand{
  font-family:'Bebas Neue',sans-serif;font-size:1.6rem;
  letter-spacing:.25em;color:var(--green);
  text-shadow:0 0 18px var(--green-glow);
}

#nav1 .brand span{color:var(--white)}

/* NAVBAR 2 */
#nav2{
  position:fixed;top:var(--nav1-h);left:0;right:0;z-index:999;
  height:var(--nav2-h);background:rgba(13,15,26,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:6px;
}

.nav-link{
  font-family:'Outfit',sans-serif;font-weight:500;font-size:.88rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:8px 22px;border-radius:6px;cursor:pointer;border:none;
  background:none;transition:all .25s;text-decoration:none;
}

.nav-link:hover,.nav-link.active{color:var(--green);background:var(--green-glow)}

/* PAGES */
.page{display:none;padding-top:var(--top-offset);min-height:100vh}
.page.active{display:block}

/* CONTAINER */
.container{max-width:1200px;margin:0 auto;padding:60px 24px 100px}

.page-header{text-align:center;margin-bottom:60px}

.section-label{
  font-family:'Space Mono',monospace;font-size:.7rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--green);margin-bottom:12px;
}

.page-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,5vw,3.6rem);
  letter-spacing:.05em;margin-bottom:12px;
}

.page-subtitle{
  color:var(--muted);font-size:.95rem;line-height:1.65;
  max-width:600px;margin:0 auto;
}

/* PREDICTIONS GRID */
.predictions-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:24px;
}

.prediction-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  transition:transform .3s,border-color .3s,box-shadow .3s;
  animation:fadeUp .5s ease both;
}

.prediction-card:hover{
  transform:translateY(-4px);border-color:var(--green);
  box-shadow:0 0 40px rgba(0,230,118,.15);
}

.pred-header{
  background:linear-gradient(135deg,rgba(0,230,118,.12),transparent);
  padding:24px;border-bottom:1px solid var(--border);
}

.pred-match{
  font-family:'Bebas Neue',sans-serif;font-size:1.5rem;
  letter-spacing:.06em;margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}

.pred-match .vs{color:var(--muted);font-size:1rem}

.pred-meta{
  font-size:.75rem;color:var(--muted);text-align:center;line-height:1.6;
}

.confidence-badge{
  display:inline-block;padding:5px 12px;border-radius:100px;
  font-size:.65rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-top:8px;
}

.confidence-badge.HIGH{background:rgba(0,230,118,.2);color:var(--green);border:1px solid var(--green)}
.confidence-badge.MEDIUM{background:rgba(255,193,7,.15);color:#ffc107;border:1px solid #ffc107}
.confidence-badge.LOW{background:rgba(255,107,53,.15);color:var(--accent);border:1px solid var(--accent)}

.pred-body{padding:24px;display:flex;flex-direction:column;gap:24px}

.pred-section h4{
  font-size:.65rem;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}

.pred-section h4::after{content:'';flex:1;height:1px;background:var(--border)}

/* Winner bars */
.winner-bars{display:flex;gap:8px;align-items:stretch}

.w-bar-wrap{flex:1;text-align:center}

.w-bar-wrap .label{font-size:.65rem;color:var(--muted);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.w-bar-outer{height:60px;background:var(--deep);border-radius:6px;
  position:relative;overflow:hidden}

.w-bar-inner{
  position:absolute;bottom:0;left:0;right:0;border-radius:6px 6px 0 0;
  transition:height .5s cubic-bezier(.16,1,.3,1);
}

.w-bar-inner.home{background:linear-gradient(0deg,var(--green),rgba(0,230,118,.4))}
.w-bar-inner.draw{background:linear-gradient(0deg,#ffc107,rgba(255,193,7,.3))}
.w-bar-inner.away{background:linear-gradient(0deg,#3d5afe,rgba(61,90,254,.4))}

.w-pct{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;margin-top:6px}
.w-pct.home{color:var(--green)}
.w-pct.draw{color:#ffc107}
.w-pct.away{color:#3d5afe}

/* XG */
.xg-row{display:flex;gap:10px;align-items:center;justify-content:space-around}

.xg-team{text-align:center}

.xg-num{
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;
  color:var(--green);text-shadow:0 0 15px var(--green-glow);
}

.xg-team-name{font-size:.65rem;color:var(--muted);margin-top:4px}

.xg-sep{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--border)}

/* Probability grid */
.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.prob-item{
  background:var(--deep);border:1px solid var(--border);
  border-radius:8px;padding:10px;text-align:center;
}

.prob-item .p-label{
  font-size:.6rem;color:var(--muted);margin-bottom:6px;
  letter-spacing:.08em;text-transform:uppercase;
}

.prob-item .p-val{
  font-family:'Bebas Neue',sans-serif;font-size:1.2rem;
  color:var(--green);text-shadow:0 0 10px var(--green-glow);
}

.prob-item .p-val.accent{color:var(--accent)}
.prob-item .p-val.blue{color:#3d5afe}

/* Form bubbles */
.form-bubbles{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}

.fb{
  width:22px;height:22px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:700;
}

.fb.W{background:rgba(0,230,118,.2);color:var(--green);border:1px solid var(--green)}
.fb.D{background:rgba(255,193,7,.15);color:#ffc107;border:1px solid #ffc107}
.fb.L{background:rgba(255,107,53,.15);color:var(--accent);border:1px solid var(--accent)}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:80px 32px;
}

.empty-state-icon{font-size:4rem;margin-bottom:20px}

.empty-state h3{
  font-family:'Bebas Neue',sans-serif;font-size:2rem;
  letter-spacing:.05em;margin-bottom:12px;
}

.empty-state p{color:var(--muted);line-height:1.6;margin-bottom:32px}

.btn-admin{
  display:inline-block;padding:14px 32px;background:linear-gradient(135deg,var(--green),var(--green-dim));
  color:var(--black);font-family:'Bebas Neue',sans-serif;
  font-size:1rem;letter-spacing:.1em;cursor:pointer;
  border:none;border-radius:10px;transition:all .2s;
  text-decoration:none;box-shadow:0 4px 16px rgba(0,230,118,.3);
}

.btn-admin:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,230,118,.4)}

/* ANIMATIONS */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* RESPONSIVE */
@media(max-width:480px){
  :root{--nav1-h:44px;--nav2-h:48px;--top-offset:92px}
  .container{padding:40px 16px 80px}
  .page-title{font-size:2rem}
  .predictions-grid{grid-template-columns:1fr;gap:16px}
  .pred-header{padding:16px}
  .pred-body{padding:16px;gap:16px}
  .prob-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .prob-item{padding:8px}
  .prob-item .p-val{font-size:1rem}
}

@media(max-width:768px){
  .predictions-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
}
</style>
</head>
<body>

<!-- NAVBAR 1 -->
<nav id="nav1">
  <div class="brand">soccer<span>-pro</span></div>
</nav>

<!-- NAVBAR 2 -->
<nav id="nav2">
  <button class="nav-link" onclick="goHome()">Home</button>
  <button class="nav-link active" onclick="">Palpites</button>
</nav>

<!-- PAGE -->
<div class="page active" id="page-predictions">
  <div class="container">
    
    <div class="page-header">
      <div class="section-label">Análise Publicada</div>
      <h2 class="page-title">Palpites do Dia</h2>
      <p class="page-subtitle">Previsões calculadas e publicadas pelos nossos especialistas com base em análise de Poisson.</p>
    </div>

    <div id="predictions-container">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <h3>Nenhum palpite ainda</h3>
        <p>Aguarda pelos palpites dos próximos jogos.<br>Os dados serão atualizados automaticamente!</p>
      </div>
    </div>

  </div>
</div>

<script>
// ════════════════════════════════════════
//  CARREGAR PALPITES
// ════════════════════════════════════════
function loadPredictions(){
  const predictions = JSON.parse(localStorage.getItem('predictions')) || [];
  const container = document.getElementById('predictions-container');

  if(predictions.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <h3>Nenhum palpite ainda</h3>
        <p>Aguarda pelos palpites dos próximos jogos.<br>Os dados serão atualizados automaticamente!</p>
      </div>`;
    return;
  }

  let html = '<div class="predictions-grid">';

  predictions.forEach((p, i) => {
    const hwp = p.home_win_pct;
    const drp = p.draw_pct;
    const awp = p.away_win_pct;

    const formBubbles = s => s.split('').map(c=>{
      if(c==='W'||c==='D'||c==='L') return `<div class="fb ${c}">${c}</div>`;
      return '';
    }).join('');

    html += `
    <div class="prediction-card" style="animation-delay:${i*0.1}s">
      <div class="pred-header">
        <div class="pred-match">
          ${p.home_team}
          <span class="vs">vs</span>
          ${p.away_team}
        </div>
        <div class="pred-meta">
          🏆 ${p.league || '—'}<br>
          📅 ${p.match_date}
        </div>
        <div class="confidence-badge ${p.confidence}">${p.confidence}</div>
      </div>

      <div class="pred-body">
        
        <!-- VITÓRIA -->
        <div class="pred-section">
          <h4>Probabilidade de Vitória</h4>
          <div class="winner-bars">
            <div class="w-bar-wrap">
              <div class="label">${p.home_team}</div>
              <div class="w-bar-outer"><div class="w-bar-inner home" style="height:${hwp}%"></div></div>
              <div class="w-pct home">${hwp.toFixed(1)}%</div>
            </div>
            <div class="w-bar-wrap">
              <div class="label">Empate</div>
              <div class="w-bar-outer"><div class="w-bar-inner draw" style="height:${drp}%"></div></div>
              <div class="w-pct draw">${drp.toFixed(1)}%</div>
            </div>
            <div class="w-bar-wrap">
              <div class="label">${p.away_team}</div>
              <div class="w-bar-outer"><div class="w-bar-inner away" style="height:${awp}%"></div></div>
              <div class="w-pct away">${awp.toFixed(1)}%</div>
            </div>
          </div>
        </div>

        <!-- XG -->
        <div class="pred-section">
          <h4>Golos Esperados (xG)</h4>
          <div class="xg-row">
            <div class="xg-team">
              <div class="xg-num">${p.expected_goals_home.toFixed(2)}</div>
              <div class="xg-team-name">${p.home_team}</div>
            </div>
            <div class="xg-sep">vs</div>
            <div class="xg-team">
              <div class="xg-num" style="color:#3d5afe;text-shadow:0 0 15px rgba(61,90,254,.4)">${p.expected_goals_away.toFixed(2)}</div>
              <div class="xg-team-name">${p.away_team}</div>
            </div>
          </div>
        </div>

        <!-- PROBABILIDADES -->
        <div class="pred-section">
          <h4>Probabilidades de Golos</h4>
          <div class="prob-grid">
            <div class="prob-item"><div class="p-label">Over 1.5</div><div class="p-val">${p.over_1_5_pct.toFixed(1)}%</div></div>
            <div class="prob-item"><div class="p-label">Over 2.5</div><div class="p-val">${p.over_2_5_pct.toFixed(1)}%</div></div>
            <div class="prob-item"><div class="p-label">Over 3.5</div><div class="p-val accent">${p.over_3_5_pct.toFixed(1)}%</div></div>
            <div class="prob-item"><div class="p-label">BTTS</div><div class="p-val">${p.btts_pct.toFixed(1)}%</div></div>
            <div class="prob-item"><div class="p-label">${p.home_team} O 0.5</div><div class="p-val">${p.home_over_0_5_pct.toFixed(1)}%</div></div>
            <div class="prob-item"><div class="p-label">${p.away_team} O 0.5</div><div class="p-val">${p.away_over_0_5_pct.toFixed(1)}%</div></div>
          </div>
        </div>

        ${p.home_form||p.away_form?`
        <!-- FORMA -->
        <div class="pred-section">
          <h4>Forma Recente</h4>
          ${p.home_form?`<div style="margin-bottom:8px"><div style="font-size:.7rem;color:var(--white);margin-bottom:6px">🏠 ${p.home_team}</div><div class="form-bubbles">${formBubbles(p.home_form)}</div></div>`:''}
          ${p.away_form?`<div><div style="font-size:.7rem;color:var(--white);margin-bottom:6px">✈️ ${p.away_team}</div><div class="form-bubbles">${formBubbles(p.away_form)}</div></div>`:''}
        </div>
        `:''}

      </div>
    </div>`;
  });

  html += '</div>';
  container.innerHTML = html;
}

function goHome(){
  window.location.href = 'Index.html';
}

// Carregar ao abrir
window.addEventListener('load', loadPredictions);

// Atualizar a cada 3 segundos (para sincronizar com admin)
setInterval(loadPredictions, 3000);
</script>
</body>
</html>
